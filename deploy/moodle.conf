<VirtualHost *:80>
    ServerAdmin admin@vps.moodlecapacitacion.cl
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Evitar acceso directo a archivos de configuracion o git si se mapean
    <Directory /var/www/html>
        <Files "config.php">
            Require all denied
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/moodle_error.log
    CustomLog ${APACHE_LOG_DIR}/moodle_access.log combined
</VirtualHost>

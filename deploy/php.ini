[PHP]
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
post_max_size = 250M
upload_max_filesize = 250M
max_input_vars = 5000

[Date]
date.timezone = "America/Santiago"

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.save_comments = 1
